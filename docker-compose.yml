
# ============================================================
# TeleMed Telemedicine Platform - Docker Compose
# Arsitektur:
#   Pengguna -> Frontend (Nginx, host port 8080)
#            -> Backend API (Python FastAPI, internal port 8000)
#            -> PostgreSQL 16 (internal port 5432)
# ============================================================

services:

  # ==========================================================
  # SERVICE 1: FRONTEND (React 19 + Vite -> Nginx)
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - telemed_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================
  # SERVICE 2: BACKEND (Python FastAPI)
  # Tanpa container_name dan ports agar bisa di-scale
  # ==========================================================
  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - backups:/backups
    networks:
      - telemed_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SERVICE 3: DATABASE (PostgreSQL 16 + WAL Archiving)
  # ==========================================================
  db:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5433:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - telemed_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SERVICE 4: BACKUP JOB
  # ==========================================================
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backups:/backups
      - wal_archive:/wal_archive:ro
      - ./offsite:/offsite
    secrets:
      - backup_key
    networks:
      - telemed_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # SERVICE 5: MinIO (File Storage / CDN Node Lokal)
  # Pertemuan 5: File Management & Content Delivery Network
  # S3 API  → port 9000 (internal & host)
  # Console → port 9001 (admin web UI)
  # ==========================================================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - telemed_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ============================================================
# SECRETS
# ============================================================
secrets:
  backup_key:
    file: ./secrets/backup_key.txt

# ============================================================
# VOLUMES
# ============================================================
volumes:
  pgdata:
  wal_archive:
  backups:
  minio_data:

# ============================================================
# NETWORKS
# ============================================================
networks:
  telemed_net:
    name: telemed_net
