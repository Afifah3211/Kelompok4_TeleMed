# ============================================================
# MediSync Telemedicine Platform - Docker Compose
# Arsitektur: Multi-Container (Frontend + Backend + DRP)
#
# Layanan:
#   - frontend  : React SPA via Nginx (port 80)
#   - backend   : Node.js Express API (port 5000)
#   - db-backup : Scheduled backup container (DRP Fondasi)
#
# Docker Volumes (Persistensi Data - Fondasi DRP):
#   - medisync_db_data    → SQLite database file (PRIMARY)
#   - medisync_backups    → Snapshot backup JSON/binary
#   - medisync_recovery   → Script & log recovery DRP
#
# Jalankan: docker compose up -d --build
# Stop:     docker compose down
# Reset:    docker compose down -v  (HAPUS semua volume!)
# ============================================================

services:

  # ─────────────────────────────────────────────────────────
  # SERVICE 1: BACKEND (Node.js Express API + SQLite)
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medisync_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      # DB_PATH → lokasi SQLite di volume persisten (Fondasi DRP)
      # Data TIDAK hilang meski container dihapus, karena ada di volume
      DB_PATH: /app/db/data/medisync.db
      SCHEMA_PATH: /app/db/schema.sql
      BACKUP_DIR: /app/backups
      RECOVERY_DIR: /app/recovery
      # ALLOW_DRP_DEMO: aktifkan endpoint simulasi insiden untuk demo/presentasi
      ALLOW_DRP_DEMO: "true"

    volumes:
      # ── VOLUME PERSISTEN (Fondasi DRP) ──────────────────────
      # Volume 1: SQLite database file — PERSISTEN meski container restart/rebuild
      - medisync_db_data:/app/db/data
      # Volume 2: Backup snapshot PITR (aturan 3-2-1)
      - medisync_backups:/app/backups
      # Volume 3: Log & artefak recovery DRP
      - medisync_recovery:/app/recovery

    networks:
      - medisync_network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    # Batasi resource container
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────
  # SERVICE 2: FRONTEND (React + Nginx)
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: medisync_frontend
    restart: unless-stopped

    ports:
