  # ─────────────────────────────────────────────────────────
  # SERVICE 3: DRP BACKUP SCHEDULER
  # Fondasi Disaster Recovery Plan (DRP):
  #   - Otomatis snapshot database setiap 24 jam
  #   - Menyimpan ke volume medisync_backups
  #   - Rotasi backup: simpan 7 hari terakhir
  # ─────────────────────────────────────────────────────────
  db-backup:
    image: alpine:3.19
    container_name: medisync_drp_backup
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      # Akses BACA database (sumber backup)
      - medisync_db_data:/data/db:ro
      # Akses TULIS ke direktori backup (tujuan)
      - medisync_backups:/data/backups
      # Mount script DRP dari folder recovery/
      - ./recovery:/scripts:ro

    networks:
      - medisync_network

    # Jalankan scheduled backup setiap 24 jam
    # Format: cp database → tambahkan timestamp → hapus backup >7 hari
    command: >
      sh -c "
        apk add --no-cache sqlite curl &&
        echo '[DRP] MediSync Backup Scheduler aktif' &&
        while true; do
          TIMESTAMP=\$$(date '+%Y%m%d_%H%M%S') &&
          BACKUP_FILE=/data/backups/medisync_drp_\$$TIMESTAMP.db &&
          echo \"[DRP] \$$(date): Memulai backup ke \$$BACKUP_FILE\" &&
          if [ -f /data/db/medisync.db ]; then
            sqlite3 /data/db/medisync.db \".backup '\$$BACKUP_FILE'\" &&
            echo \"[DRP] \$$(date): Backup BERHASIL - \$$BACKUP_FILE\" ||
            echo \"[DRP] \$$(date): Backup GAGAL\";
          else
            echo \"[DRP] \$$(date): Database belum tersedia, menunggu...\";
          fi &&
          find /data/backups -name 'medisync_drp_*.db' -mtime +7 -delete &&
          echo \"[DRP] \$$(date): Rotasi backup selesai. Tidur 24 jam...\" &&
          sleep 86400;
        done
      "

    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "5"

# ─────────────────────────────────────────────────────────────
# DOCKER VOLUMES — FONDASI DRP (Disaster Recovery Plan)
# Semua data persisten disimpan di volume Docker terkelola.
# Data TIDAK hilang meskipun container di-restart/rebuild.
# ─────────────────────────────────────────────────────────────
volumes:
  # Volume 1: SQLite database file (PRIMARY DATA STORE)
  # → Dipasang di backend:/app/db/data & db-backup:/data/db
  medisync_db_data:
    driver: local
    labels:
      com.medisync.description: "MediSync SQLite Database - PRIMARY"
      com.medisync.drp: "true"
      com.medisync.backup-tier: "primary"

  # Volume 2: Backup snapshots (aturan 3-2-1 Copy 1)
  # → Dipasang di backend:/app/backups & db-backup:/data/backups
  medisync_backups:
    driver: local
    labels:
      com.medisync.description: "MediSync Backup Snapshots - DRP Tier 1"
      com.medisync.drp: "true"
      com.medisync.backup-tier: "copy-1"

  # Volume 3: Recovery logs & artefak DRP
  # → Dipasang di backend:/app/recovery
  medisync_recovery:
    driver: local
    labels:
      com.medisync.description: "MediSync Recovery Artifacts & Logs"
      com.medisync.drp: "true"
      com.medisync.backup-tier: "recovery"

# ─────────────────────────────────────────────────────────────
# NETWORKS — Jaringan internal terisolasi antar container
# ─────────────────────────────────────────────────────────────
networks:
  medisync_network:
    driver: bridge
    name: medisync_net
    labels:
      com.medisync.description: "Jaringan internal MediSync"
