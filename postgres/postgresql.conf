# ============================================================
# TeleMed - postgresql.conf (sesuai Lampiran A.2 laporan)
# ============================================================
listen_addresses = '*'
port = 5432
max_connections = 200          # naik dari default 100 karena backend bisa 5 replika x pool 10
shared_buffers = 256MB

# --- WAL archiving (dasar PITR) ---
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
archive_timeout = 60           # paksa arsip WAL tiap maksimal 60 detik
max_wal_senders = 5            # dibutuhkan pg_basebackup

# --- Logging ---
logging_collector = off
log_min_duration_statement = 500   # catat query lambat > 500 ms (berguna buat analisis bottleneck)
log_connections = off
