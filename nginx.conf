proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=file_cache:10m
                 max_size=256m inactive=1d use_temp_path=off;

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip compression untuk performa
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Health check endpoint untuk Docker HEALTHCHECK
    location /health {
        access_log off;
        return 200 '{"status":"ok","app":"medisync-frontend"}';
        add_header Content-Type application/json;
    }

    # DNS Docker internal resolver untuk dynamic load balancing ke replika backend
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        # Backend menerima aset sampai 10 MiB; beri ruang untuk multipart boundary.
        client_max_body_size 11m;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # React SPA: fallback ke index.html untuk client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # CDN Proxy: hanya gambar chat dari MinIO yang disajikan lewat edge
    # Lampiran chat memakai URL HMAC sementara dan dikaitkan ke konsultasi di API
    # URL: /files/{object_key} → MinIO bucket
    # Gunakan ^~ agar tidak teroverride oleh regex static assets (~* \.(png|jpg...))
    # ============================================================
    location ^~ /files/ {
        set $minio_upstream http://minio:9000;
        auth_request /_file_auth;
        rewrite ^/files/(.*)$ /telemed-files/$1 break;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache headers — efek CDN: browser cache 1 hari
        proxy_cache file_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        proxy_cache_key "$scheme$request_method$host$uri";
        add_header Cache-Control "private, max-age=3600, stale-while-revalidate=300" always;
        add_header X-CDN-Node "telemed-minio-local";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;

        # Sembunyikan error MinIO, kembalikan 404 yang bersih
        proxy_intercept_errors on;
        error_page 403 404 = @cdn_not_found;
    }

    location = /_file_auth {
        internal;
        proxy_pass http://backend:8000/api/files/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @cdn_not_found {
        return 404 '{"detail":"File tidak ditemukan di CDN storage"}';
        add_header Content-Type application/json;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
