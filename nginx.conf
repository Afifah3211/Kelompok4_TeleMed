server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip compression untuk performa
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Health check endpoint untuk Docker HEALTHCHECK
    location /health {
        access_log off;
        return 200 '{"status":"ok","app":"medisync-frontend"}';
        add_header Content-Type application/json;
    }

    # DNS Docker internal resolver untuk dynamic load balancing ke replika backend
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # React SPA: fallback ke index.html untuk client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # CDN Proxy: file yang diupload user langsung ke MinIO
    # Pertemuan 5: Nginx sebagai Edge CDN Node dummy
    # URL: /files/{object_key} → MinIO bucket
    # ============================================================`r`n    location /files/ {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream/telemed-files/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache headers — efek CDN: browser cache 1 hari
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        add_header X-CDN-Node "telemed-minio-local";
        add_header X-Cache-Status "HIT";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;

        # Sembunyikan error MinIO, kembalikan 404 yang bersih
        proxy_intercept_errors on;
        error_page 403 404 = @cdn_not_found;
    }

    location @cdn_not_found {
        return 404 '{"detail":"File tidak ditemukan di CDN storage"}';
        add_header Content-Type application/json;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
